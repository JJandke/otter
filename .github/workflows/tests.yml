name: M1 offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Unit tests (no credentials, no browser, no network)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Check repository for private artifacts
        run: python scripts/check_public_tree.py
